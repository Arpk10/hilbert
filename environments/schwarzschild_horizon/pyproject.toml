[project]
name = "schwarzschild-horizon"
version = "0.1.0"
description = "Deterministic Schwarzschild horizon verification taskset for verifiers v1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
